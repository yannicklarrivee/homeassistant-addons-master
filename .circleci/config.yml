version: 2.1
setup: true
orbs:
  path-filtering: circleci/path-filtering@1.1.0

workflows:
  setup-workflow:
    jobs:
      - path-filtering/filter:
          name: check-changed-paths
          base-revision: master
          mapping: |
            <<#matrix.path>>
              <<#matrix.target-arch>>
                <<#matrix.target-executor>>
                  <<.>>/* build-<<.>>-<<../.>>-<<../../.>> true
                <</matrix.target-executor>>
              <</matrix.target-arch>>
            <</matrix.path>>
            <<#publish.path>>
              <<#publish.target-arch>>
                <<#publish.target-executor>>
                  <<.>>-<<../.>>-<<../../.>>/* publish true
                <</publish.target-executor>>
              <</publish.target-arch>>
            <</publish.path>>
          config-path: .circleci/continue_config.yml
