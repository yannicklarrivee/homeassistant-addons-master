version: 2.1
executors:
  arm-executor:
    machine:
      image: ubuntu-2004:current
    resource_class: arm.medium
  amd-executor:
    machine:
      image: ubuntu-2004:current
    resource_class: medium
orbs:
  docker: circleci/docker@2.1.3
  yq: nikkei/rnikkei-yq@0.0.3
  path-filtering: circleci/path-filtering@1.2.0
jobs:
  install-yq:
    executor: arm-executor
    steps:
      - yq/install
  build:
    executor: << parameters.target-executor >>
    parameters:
      path:
        type: string
      target-arch:
        type: string
      target-executor:
        type: string
    steps:
      - checkout
      - run:
          name: Set ARCH and PLATFORM variables
          command: |
            echo "export ARCH=$(case << parameters.target-arch >> in aarch64) echo arm64 ;; amd64) echo amd64 ;; armv7) echo armhf ;; i386) echo i386 ;; esac)" >> "$BASH_ENV"
            echo "export PLATFORM=$(case << parameters.target-arch >> in aarch64) echo linux/arm64 ;; amd64) echo linux/amd64 ;; armv7) echo linux/arm/v7 ;; i386) echo linux/386 ;; esac)" >> "$BASH_ENV"
            source "$BASH_ENV"
      - run:
          name: Set BASE_IMAGE variable
          command: |
            echo 'export BASE_IMAGE=$(cat ./<< parameters.path >>/build.yml | yq '"'"'.build_from.[env(ARCH)]'"'"')' >> "$BASH_ENV"
            source "$BASH_ENV"
  publish-image:
    executor: << parameters.target-executor >>
    parameters:
      path:
        type: string
      target-arch:
        type: string
      target-executor:
        type: string
    steps:
      - run:
          name: Set TAG variable
          command: |
            echo 'export TAG=$(cat ./<< parameters.path >>/config.yml | yq '"'"'.version'"'"')' >> "$BASH_ENV"
            source "$BASH_ENV"
  publish:
    executor: << parameters.target-executor >>
    parameters:
      path:
        type: string
      target-arch:
        type: string
      target-executor:
        type: string
      tag:
        type: string
    steps:
      - docker/publish:
          name: Publish << parameters.target-arch >>-<< parameters.path >> addon
          image: $DOCKER_LOGIN/$ARCH-<< parameters.path >>
          extra_build_args: --build-arg BUILD_FROM=$BASE_IMAGE --platform $PLATFORM
          docker-context: << parameters.path >>
          tag: << parameters.tag >>

workflows:
  build-and-publish-addons-images:
    jobs:
      - install-yq
      - path-filtering/filter:
          name: check-changed-paths
          base-revision: master
          mapping: |
            rtl4332mqtt-interlogix-autodiscovery/* build-rtl4332mqtt-interlogix-autodiscovery-aarch64-arm-executor true
            tshark/* build-tshark-aarch64-arm-executor true
            oauth2-proxy/* build-oauth2-proxy-aarch64-arm-executor true
            dropbox-autodelete/* build-dropbox-autodelete-aarch64-arm-executor true
            nginx_proxy/* build-nginx_proxy-aarch64-arm-executor true
            voipms-mms/* build-voipms-mms-aarch64-arm-executor true
            dropbox-sync/* build-dropbox-sync-aarch64-arm-executor true
            rtl4332mqtt-interlogix-autodiscovery/* build-rtl4332mqtt-interlogix-autodiscovery-amd64-amd-executor true
            tshark/* build-tshark-amd64-amd-executor true
            oauth2-proxy/* build-oauth2-proxy-amd64-amd-executor true
            dropbox-autodelete/* build-dropbox-autodelete-amd64-amd-executor true
            nginx_proxy/* build-nginx_proxy-amd64-amd-executor true
            voipms-mms/* build-voipms-mms-amd64-amd-executor true
            dropbox-sync/* build-dropbox-sync-amd64-amd-executor true
            rtl4332mqtt-interlogix-autodiscovery/* build-rtl4332mqtt-interlogix-autodiscovery-armv7-arm-executor true
            tshark/* build-tshark-armv7-arm-executor true
            oauth2-proxy/* build-oauth2-proxy-armv7-arm-executor true
            dropbox-autodelete/* build-dropbox-autodelete-armv7-arm-executor true
            nginx_proxy/* build-nginx_proxy-armv7-arm-executor true
            voipms-mms/* build-voipms-mms-armv7-arm-executor true
            dropbox-sync/* build-dropbox-sync-armv7-arm-executor true
            rtl4332mqtt-interlogix-autodiscovery/* build-rtl4332mqtt-interlogix-autodiscovery-i386-arm-executor true
            tshark/* build-tshark-i386-arm-executor true
            oauth2-proxy/* build-oauth2-proxy-i386-arm-executor true
            dropbox-autodelete/* build-dropbox-autodelete-i386-arm-executor true
            nginx_proxy/* build-nginx_proxy-i386-arm-executor true
            voipms-mms/* build-voipms-mms-i386-arm-executor true
            dropbox-sync/* build-dropbox-sync-i386-arm-executor true
            rtl4332mqtt-interlogix-autodiscovery-amd64-amd-executor/* publish true
            tshark-amd64-amd-executor/* publish true
            oauth2-proxy-amd64-amd-executor/* publish true
            dropbox-autodelete-amd64-amd-executor/* publish true
            nginx_proxy-amd64-amd-executor/* publish true
            voipms-mms-amd64-amd-executor/* publish true
            dropbox-sync-amd64-amd-executor/* publish true
            rtl4332mqtt-interlogix-autodiscovery-aarch64-arm-executor/* publish true
            tshark-aarch64-arm-executor/* publish true
            oauth2-proxy-aarch64-arm-executor/* publish true
            dropbox-autodelete-aarch64-arm-executor/* publish true
            nginx_proxy-aarch64-arm-executor/* publish true
            voipms-mms-aarch64-arm-executor/* publish true
            dropbox-sync-aarch64-arm-executor/* publish true
            rtl4332mqtt-interlogix-autodiscovery-armv7-arm-executor/* publish true
            tshark-armv7-arm-executor/* publish true
            oauth2-proxy-armv7-arm-executor/* publish true
            dropbox-autodelete-armv7-arm-executor/* publish true
            nginx_proxy-armv7-arm-executor/* publish true
            voipms-mms-armv7-arm-executor/* publish true
            dropbox-sync-armv7-arm-executor/* publish true
            rtl4332mqtt-interlogix-autodiscovery-i386-arm-executor/* publish true
            tshark-i386-arm-executor/* publish true
            oauth2-proxy-i386-arm-executor/* publish true
            dropbox-autodelete-i386-arm-executor/* publish true
            nginx_proxy-i386-arm-executor/* publish true
            voipms-mms-i386-arm-executor/* publish true
            dropbox-sync-i386-arm-executor/* publish true
